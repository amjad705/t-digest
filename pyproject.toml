[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tdigest"
version = "0.1.0"
description = "Pure-Python merging t-digest for streaming quantile estimation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["tdigest"]
